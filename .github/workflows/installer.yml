name: Build Resolve plugin installers

# Builds the macOS .pkg and Windows .exe installers for the DaVinci
# Resolve sync plugin. Triggers on:
#   - push of a tag matching `resolve-plugin-v*` (cuts a release)
#   - manual workflow_dispatch (smoke-build for testing)
#
# Outputs are uploaded as workflow artifacts. On a tag push they are also
# attached to the corresponding GitHub Release. Installer filenames carry
# the plugin version (e.g. MMLOneResolveSync-v0.2.1.pkg) so a downloaded
# file is self-identifying — server/installers.ts in the web app derives
# the same versioned name from RESOLVE_PLUGIN_RELEASE_TAG.

on:
  push:
    tags:
      - 'resolve-plugin-v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to attach release assets

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack mml_sync.zip
        run: python3 installer/pack_plugin.py
      - name: Build .pkg
        run: |
          chmod +x installer/macos/build.sh
          ./installer/macos/build.sh
      - name: Stamp version into filename
        id: artifact
        run: |
          VERSION=$(grep -E "__version__" mml_sync/__init__.py | head -1 | cut -d "'" -f 2)
          [ -n "$VERSION" ] || { echo "could not read plugin version"; exit 1; }
          DST="dist/macos/MMLOneResolveSync-v${VERSION}.pkg"
          mv dist/macos/MMLOneResolveSync.pkg "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMLOneResolveSync-macos
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/resolve-plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack mml_sync.zip
        shell: bash
        run: python installer/pack_plugin.py
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Chocolatey installs NSIS into Program Files (x86) but does NOT
          # update PATH for subsequent workflow steps. Append it manually
          # via GITHUB_PATH so the next step finds makensis.exe.
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build installer .exe
        shell: cmd
        run: |
          mkdir dist\windows
          cd installer\windows
          makensis installer.nsi
      - name: Stamp version into filename
        id: artifact
        shell: bash
        run: |
          VERSION=$(grep -E "__version__" mml_sync/__init__.py | head -1 | cut -d "'" -f 2)
          [ -n "$VERSION" ] || { echo "could not read plugin version"; exit 1; }
          DST="dist/windows/MMLOneResolveSync-Setup-v${VERSION}.exe"
          mv dist/windows/MMLOneResolveSync-Setup.exe "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMLOneResolveSync-windows
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/resolve-plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
