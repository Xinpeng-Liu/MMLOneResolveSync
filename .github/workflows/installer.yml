name: Build Resolve plugin installers

# Builds the macOS .pkg and Windows .exe installers for the DaVinci
# Resolve sync plugin. Triggers on:
#   - push of a tag matching `resolve-plugin-v*` (cuts a release)
#   - manual workflow_dispatch (smoke-build for testing)
#
# Outputs are uploaded as workflow artifacts. On a tag push they are also
# attached to the corresponding GitHub Release.

on:
  push:
    tags:
      - 'resolve-plugin-v*'
  workflow_dispatch:

permissions:
  contents: write  # needed to attach release assets

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .pkg
        run: |
          chmod +x installer/macos/build.sh
          ./installer/macos/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMLOneResolveSync-macos
          path: dist/macos/MMLOneResolveSync.pkg
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/resolve-plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macos/MMLOneResolveSync.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build installer .exe
        shell: cmd
        run: |
          mkdir dist\windows
          cd installer\windows
          makensis installer.nsi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMLOneResolveSync-windows
          path: dist/windows/MMLOneResolveSync-Setup.exe
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/resolve-plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows/MMLOneResolveSync-Setup.exe
